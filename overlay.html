<div id="ai-ui" style="position: fixed; bottom: 20px; right: 20px; font-family: sans-serif;">
    <div id="ai-box" style="display: none; width: 280px; background: #fff; border: 1px solid #ccc; padding: 10px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h4 style="margin: 0 0 10px 0;">AI-Настройщик</h4>
        <textarea id="ai-txt" style="width: 100%; height: 60px;" placeholder="Что изменить?"></textarea>
        <button onclick="sendAI()" style="width: 100%; margin-top: 5px; background: #000; color: #fff; border: none; padding: 5px; cursor: pointer;">Применить</button>
        <p id="ai-status" style="font-size: 10px; color: gray;"></p>
    </div>
    <button onclick="toggleAI()" style="width: 50px; height: 50px; border-radius: 25px; cursor: pointer; background: #000; color: #fff; font-size: 20px; border: none;">🤖</button>
</div>

<script>
    function toggleAI() { 
        const box = document.getElementById('ai-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async def sendAI() {
        const txt = document.getElementById('ai-txt').value;
        const status = document.getElementById('ai-status');
        status.innerText = "⏳ Миллион токенов на связи...";
        
        const res = await fetch('http://localhost:8000/process_ai', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                command: txt, 
                current_config: { welcome: "Привет!" }, // Сюда подставляй данные из своей админки
                bot_id: "test_bot" 
            })
        });
        const data = await res.json();
        status.innerText = data.status === "success" ? "✅ Конфиг обновлен" : "❌ Ошибка";
    }
</script>
